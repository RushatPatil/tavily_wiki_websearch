[project]
name = "mcp-folder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.1",
    "langchain>=1.2.10",
    "langchain-community>=0.4.1",
    "langchain-tavily>=0.2.17",
    "langgraph>=1.0.10",
    "mcp[cli]>=1.26.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
mcp-server = "main:main_call"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

